name: Data maintenance audit

on:
  schedule:
    - cron: "43 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2ray-pool-maintenance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out engine source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install .

      - name: Audit State and archive integrity
        run: python -m engine.cli audit-state --data-root data-source
