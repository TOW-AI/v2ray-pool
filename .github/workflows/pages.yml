name: Deploy dashboard

on:
  push:
    branches: [main, data]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out main source
        uses: actions/checkout@v4
        with:
          ref: main
          path: engine-source
          persist-credentials: false

      - name: Check out public data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-source
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          set -euo pipefail
          mkdir -p site/data/api/v1
          cp -R engine-source/dashboard/. site/
          if [[ -d data-source/api/v1 ]]; then
            cp -R data-source/api/v1/. site/data/api/v1/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
