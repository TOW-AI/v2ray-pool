[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2ray-pool-intelligence-engine"
version = "2.0.0"
description = "A security-first pipeline for V2Ray collection, validation, Xray testing, IP intelligence, ranking, and static distribution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TOW-AI" }]
dependencies = [
  "PyYAML==6.0.3",
  "requests[socks]==2.32.5",
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.5",
  "mypy==1.19.0",
  "bandit==1.9.2",
]

[project.scripts]
v2ray-pool = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["engine"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
