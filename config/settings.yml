app:
  name: V2Ray Pool Intelligence Engine
  version: 2.0.0
  timezone: UTC
  log_level: INFO

collector:
  request_timeout_seconds: 15
  max_response_bytes: 2097152
  max_redirects: 3
  max_concurrency: 4
  refresh_interval_seconds: 3600
  user_agent: V2Ray-Pool-Intelligence-Engine/2.0
  sources: []

validator:
  allowed_protocols: [vless, vmess, trojan, ss]
  block_private_destinations: true
  block_link_local: true
  block_loopback: true
  block_multicast: true
  block_reserved: true
  tcp_timeout_seconds: 3
  denied_ports: [22, 23, 25, 445, 3389, 5900]
  require_public_ip: true

tester:
  enabled: false
  xray_binary: ""
  xray_version: v26.10.31
  xray_sha256: ""
  process_timeout_seconds: 25
  startup_timeout_seconds: 5
  max_parallel_configs: 2
  max_configs_per_run: 100
  enable_ipv4: true
  enable_ipv6: true
  ip_observers:
    - id: ipify
      url_ipv4: https://api.ipify.org?format=json
      url_ipv6: https://api6.ipify.org?format=json
      response_format: json
      response_field: ip
    - id: icanhazip
      url_ipv4: https://ipv4.icanhazip.com/
      url_ipv6: https://ipv6.icanhazip.com/
      response_format: text
      response_field: ""
    - id: ifconfig_me
      url: https://ifconfig.me/ip
      response_format: text
      response_field: ""
  min_successful_observers: 2
  observer_timeout_seconds: 8
  throughput_enabled: false
  throughput_url: ""
  throughput_max_bytes: 1048576
  throughput_timeout_seconds: 10

intelligence:
  fixed_candidate:
    min_runs: 3
    min_span_hours: 24
  fixed_verified:
    min_runs: 6
    min_span_hours: 72
  rotating:
    min_distinct_ips: 2
    min_runs: 2
  fixed_evidence_max_age_hours: 168
  reverify_after_change: true
  required_ip_families: [ipv4]

ranking:
  policy_version: 1.0.0
  max_metric_age_hours: 24
  minimum_score_coverage: 0.5
  fixed_weights:
    ip_stability: 0.35
    connection_success: 0.20
    latency: 0.15
    uptime: 0.15
    freshness: 0.15
  rotating_weights:
    connection_success: 0.35
    latency: 0.25
    uptime: 0.20
    freshness: 0.20
  balanced_weights:
    connection_success: 0.25
    latency: 0.25
    throughput: 0.20
    uptime: 0.15
    freshness: 0.15

subscription:
  encoding: base64
  include_rotating_in_main: false
  include_unstable_in_main: false
  max_top_configs: 50

api:
  schema_version: 1.0.0
  publish_raw_uri: false

history:
  daily_retention_days: 180
  weekly_retention_weeks: 104
  monthly_retention_months: 60

scheduler:
  cron: "17 */4 * * *"
  concurrency_group: v2ray-pool-data-publish

publishing:
  allow_public_sources_only: true
  reject_secrets_in_public_files: true
